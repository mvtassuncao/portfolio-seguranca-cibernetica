```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portal Acadêmico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #0f172a;
            color: #e5e7eb;
        }

        .container {
            width: 430px;
            max-width: 92%;
        }

        .card {
            background: #1e293b;

            border: 1px solid #334155;
            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #94a3b8;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #475569;
            border-radius: 7px;

            background: #0f172a;
            color: #fff;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            width: 100%;

            margin-top: 22px;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-top: 20px;

            padding: 12px;

            border-radius: 7px;

            background: #450a0a;
            border: 1px solid #dc2626;

            color: #fecaca;
        }

        .results {
            margin-top: 25px;
        }

        .results-title {
            margin-bottom: 10px;

            color: #94a3b8;
            font-size: 13px;
        }

        .result {
            margin-bottom: 10px;
            padding: 15px;

            border-radius: 7px;

            background: #0f172a;
            border: 1px solid #334155;
        }

        .field {
            margin: 6px 0;
        }

        .field-name {
            color: #64748b;
            font-size: 12px;
        }

        .field-value {
            margin-top: 2px;

            font-family: monospace;
            word-break: break-all;
        }

        /*
         * Não existe lógica de flag aqui.
         *
         * O servidor simplesmente envia os dados retornados
         * pela consulta SQL.
         */
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Portal Acadêmico</h1>

        <div class="subtitle">
            Acesso do aluno
        </div>

        <form
            method="POST"
            onsubmit="return validarMatricula()"
        >

            <label for="matricula">
                Matrícula
            </label>

            <input
                id="matricula"
                name="matricula"
                type="text"
                autocomplete="off"
                placeholder="Somente números"
            >

            <label for="senha">
                Senha
            </label>

            <input
                id="senha"
                name="senha"
                type="password"
                placeholder="Senha"
            >

            <button type="submit">
                Entrar
            </button>

        </form>


        {% if erro %}

            <div class="error">
                {{ erro }}
            </div>

        {% endif %}


        {% if resultado %}

            <div class="results">

                <div class="results-title">
                    Resultado retornado pelo servidor
                </div>

                {% for row in resultado %}

                    <div class="result">

                        {% for coluna, valor in row.items() %}

                            <div class="field">

                                <div class="field-name">
                                    {{ coluna }}
                                </div>

                                <div class="field-value">
                                    {{ valor }}
                                </div>

                            </div>

                        {% endfor %}

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    </div>

</div>


<script>
function validarMatricula() {

    const matricula =
        document.getElementById("matricula").value;

    /*
     * A validação existe SOMENTE no frontend.
     *
     * Ela pode ser contornada modificando a requisição
     * antes de ela chegar ao servidor.
     */

    if (!/^\d+$/.test(matricula)) {

        alert(
            "A matrícula deve conter somente números."
        );

        return false;
    }

    return true;
}
</script>

</body>

</html>
```
